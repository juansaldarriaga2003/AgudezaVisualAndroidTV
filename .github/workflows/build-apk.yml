name: Generar APK 2.3.6 H96MAX

on:
  workflow_dispatch:
  push:
    branches: [v2.3.6-h96max]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restaurar recursos offline
        run: |
          cat offline-assets.zip.part-* > offline-assets.zip
          unzip -q offline-assets.zip
          printf 'window.OPTOTYPES_MANIFEST=' > app/src/main/assets/optotypes/manifest-data.js
          cat app/src/main/assets/optotypes/manifest.json >> app/src/main/assets/optotypes/manifest-data.js
          printf ';\n' >> app/src/main/assets/optotypes/manifest-data.js
          cp webapp/index.html webapp/offline.css webapp/offline.js app/src/main/assets/
      - name: Verificar código
        run: gradle assembleKioskDebug
      - name: Restaurar firma
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          normalized_key="$(printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n\t ' | sed -e 's/^data:[^,]*,//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          printf '%s' "$normalized_key" | base64 --decode > "$RUNNER_TEMP/agudeza-visual.jks"
          keytool -list -keystore "$RUNNER_TEMP/agudeza-visual.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
      - name: Compilar APK kiosco firmada
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/agudeza-visual.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleKioskRelease
      - name: Preparar instalador
        run: cp app/build/outputs/apk/kiosk/release/app-kiosk-release.apk AgudezaVisual-2.3.6-Kiosco-H96MAX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgudezaVisual-2.3.6-Kiosco-H96MAX
          path: AgudezaVisual-2.3.6-Kiosco-H96MAX.apk

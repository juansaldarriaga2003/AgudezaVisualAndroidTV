name: Generar APK Android TV

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restaurar recursos offline
        run: |
          cat offline-assets.zip.part-* > offline-assets.zip
          unzip -q offline-assets.zip
      - name: Restaurar clave privada de firma
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agudeza-visual.jks"
      - name: Compilar instaladores firmados
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/agudeza-visual.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleNormalRelease assembleKioskRelease
      - name: Preparar instaladores
        run: |
          cp app/build/outputs/apk/normal/release/app-normal-release.apk AgudezaVisual-Offline.apk
          cp app/build/outputs/apk/kiosk/release/app-kiosk-release.apk AgudezaVisual-Kiosco.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgudezaVisual-Instaladores
          path: |
            AgudezaVisual-Offline.apk
            AgudezaVisual-Kiosco.apk
      - name: Publicar o actualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view estable >/dev/null 2>&1 || gh release create estable --title "Agudeza Visual 2.1.0" --notes "Instaladores firmados para Android TV. Funcionamiento offline."
          gh release upload estable AgudezaVisual-Offline.apk AgudezaVisual-Kiosco.apk --clobber
          gh release edit estable --latest

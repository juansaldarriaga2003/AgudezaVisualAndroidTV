name: Generar APK Android TV

on:
  workflow_dispatch:
  push:
    branches: [main, v2.1.0-h96max]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verificar SDK preinstalado
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Restaurar recursos offline
        run: |
          cat offline-assets.zip.part-* > offline-assets.zip
          unzip -q offline-assets.zip
      - run: gradle assembleNormalDebug assembleKioskDebug
      - name: Preparar instaladores
        run: |
          cp app/build/outputs/apk/normal/debug/app-normal-debug.apk AgudezaVisual-2.1.0-Offline.apk
          cp app/build/outputs/apk/kiosk/debug/app-kiosk-debug.apk AgudezaVisual-2.1.0-Kiosco.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgudezaVisual-2.1.0-Instaladores
          path: |
            AgudezaVisual-2.1.0-Offline.apk
            AgudezaVisual-2.1.0-Kiosco.apk

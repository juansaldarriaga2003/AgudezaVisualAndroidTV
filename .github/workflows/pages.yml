name: Publicar pagina de descarga

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "webapp/**"
      - "offline-assets.zip.part-*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar aplicación web
        run: |
          mkdir -p public/app
          cat offline-assets.zip.part-* > offline-assets.zip
          unzip -q offline-assets.zip
          cp -a docs/. public/
          cp -a app/src/main/assets/. public/app/
          cp webapp/index.html webapp/offline.css webapp/offline.js public/app/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

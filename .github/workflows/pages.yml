name: Validar paquete web

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "webapp/**"
      - "offline-assets.zip.part-*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-package
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar aplicación web
        run: |
          mkdir -p public/app
          cat offline-assets.zip.part-* > offline-assets.zip
          unzip -q offline-assets.zip
          printf 'window.OPTOTYPES_MANIFEST=' > app/src/main/assets/optotypes/manifest-data.js
          cat app/src/main/assets/optotypes/manifest.json >> app/src/main/assets/optotypes/manifest-data.js
          printf ';\n' >> app/src/main/assets/optotypes/manifest-data.js
          cp -a docs/. public/
          cp -a app/src/main/assets/. public/app/
          cp webapp/index.html webapp/offline.css webapp/offline.js public/app/
      - name: Guardar paquete web validado
        uses: actions/upload-artifact@v4
        with:
          name: AgudezaVisual-Web
          path: public
